name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
        env:
          NIX_FIRST_BUILD_UID: 400

      - name: Configure Cachix (optional)
        if: vars.CACHIX_CACHE != ''
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Check flake
        run: nix flake check --print-build-logs

      - name: Build Pi packages
        run: nix build .#pi-coding-agent .#pi-coding-agent-src --no-link --print-build-logs

      - name: Check Pi versions
        run: |
          expected_version=$(sed -n 's/^  version = "\([^"]*\)";/\1/p' package.nix | head -1)
          prebuilt_version=$(PI_PACKAGE_DIR=/nonexistent nix run .#pi-coding-agent -- --version)
          source_version=$(PI_PACKAGE_DIR=/nonexistent nix run .#pi-coding-agent-src -- --version)
          test "$prebuilt_version" = "$expected_version"
          test "$source_version" = "$expected_version"
